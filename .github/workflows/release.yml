name: GOSU Speech to Text release candidates
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            artifact: windows-x64
            bundles: nsis
          - os: ubuntu-22.04
            artifact: linux-x64
            bundles: deb,appimage
          - os: macos-15
            artifact: macos-arm64
            bundles: app,dmg
          - os: macos-15-intel
            artifact: macos-x64
            bundles: app,dmg
    timeout-minutes: 45
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential pkg-config libdbus-1-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf libfuse2
      - run: npm ci
      - run: python scripts/test-engine-paths.py
      - run: npm run check
      - run: python -m pip install -r server/requirements-build.txt
      - run: python scripts/test-python.py
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
      - run: cargo check --locked --manifest-path src-tauri/Cargo.toml
      - run: cargo test --locked --manifest-path src-tauri/Cargo.toml
      - run: npm run desktop:build -- --bundles ${{ matrix.bundles }} --ci -- --locked
      - run: python scripts/checksums.py
      - uses: actions/upload-artifact@v4
        with:
          name: gosu-speech-to-text-${{ matrix.artifact }}
          path: src-tauri/target/release/bundle/
          retention-days: 14
          if-no-files-found: error
  extension:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run extension:build
      - run: python3 scripts/package-extension.py
      - uses: actions/upload-artifact@v4
        with:
          name: gosu-speech-to-text-chrome
          path: gosu-speech-to-text-chrome.zip
          if-no-files-found: error
