name: GOSU Speech to Text release candidates
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            bundles: nsis
          - os: ubuntu-22.04
            bundles: deb,appimage
          - os: macos-14
            bundles: app,dmg
          - os: macos-15-intel
            bundles: app,dmg
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf libfuse2
      - run: npm ci
      - run: python scripts/test-engine-paths.py
      - run: npm run brand:check
      - run: npm test
      - run: python -m pip install -r server/requirements-build.txt
      - run: python -m unittest discover -s server -p "test_*.py" -v
      - run: python -m unittest discover -s tests -p "test_*.py" -v
      - run: npm run desktop:build -- --bundles ${{ matrix.bundles }}
      - run: python scripts/checksums.py
      - uses: actions/upload-artifact@v4
        with:
          name: gosu-speech-to-text-${{ matrix.os }}
          path: src-tauri/target/release/bundle/
          retention-days: 14
          if-no-files-found: error
  extension:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run extension:build
      - run: python3 scripts/package-extension.py
      - uses: actions/upload-artifact@v4
        with:
          name: gosu-speech-to-text-chrome
          path: gosu-speech-to-text-chrome.zip
          if-no-files-found: error
