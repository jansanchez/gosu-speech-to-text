name: GOSU Speech to Text release candidates
on:
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish: version tested and approved under CRITERIOS-DE-EXITO.md'
        type: boolean
        default: false
      version:
        description: 'Exact version from brand.json (required to publish)'
        type: string
        default: ''
  push:
    tags: ['v*']
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  approval:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - run: npm run release:check
      - name: Check publication approval
        env:
          PUBLISH: ${{ inputs.publish }}
          VERSION: ${{ inputs.version }}
        run: node scripts/approve-release.mjs
  desktop:
    needs: approval
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            artifact: windows-x64
            bundles: nsis
          - os: ubuntu-22.04
            artifact: linux-x64
            bundles: deb,appimage
          - os: macos-15
            artifact: macos-arm64
            bundles: app,dmg
          - os: macos-15-intel
            artifact: macos-x64
            bundles: app,dmg
    timeout-minutes: 45
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential pkg-config libdbus-1-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf libfuse2
      - run: npm run release:check
      - run: npm ci
      - run: python scripts/test-engine-paths.py
      - run: npm run check
      - run: python -m pip install -r server/requirements-build.txt
      - run: python scripts/test-python.py
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
      - run: cargo check --locked --manifest-path src-tauri/Cargo.toml
      - run: cargo test --locked --manifest-path src-tauri/Cargo.toml
      - run: npm run desktop:build -- --bundles ${{ matrix.bundles }} --ci -- --locked
      - run: python scripts/checksums.py
      - name: Inspect Linux candidate packages
        if: runner.os == 'Linux'
        run: python scripts/check-linux-packages.py src-tauri/target/release/bundle --output src-tauri/target/release/bundle/linux-package-report.json
      - uses: actions/upload-artifact@v6
        with:
          name: gosu-speech-to-text-${{ matrix.artifact }}
          path: src-tauri/target/release/bundle/
          retention-days: 14
          if-no-files-found: error
  extension:
    needs: approval
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - run: npm run release:check
      - run: npm ci
      - run: npm run extension:build
      - run: python3 scripts/package-extension.py
      - uses: actions/upload-artifact@v6
        with:
          name: gosu-speech-to-text-chrome
          path: gosu-speech-to-text-chrome.zip
          if-no-files-found: error

  publish:
    needs: [approval, desktop, extension]
    if: github.event_name == 'workflow_dispatch' && inputs.publish && github.ref == 'refs/heads/main'
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v7
        with:
          path: release-artifacts
          pattern: gosu-speech-to-text-*
      - name: Assemble and verify release assets
        run: python scripts/release-assets.py release-artifacts release-assets
      - name: Publish approved version
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PUBLISH: ${{ inputs.publish }}
          VERSION: ${{ inputs.version }}
        run: node scripts/approve-release.mjs --publish
